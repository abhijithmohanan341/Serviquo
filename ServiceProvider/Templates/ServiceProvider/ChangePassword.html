{% extends 'ServiceProvider/Header.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

<style>
    :root {
        --navy: #1e293b;
        --gold: #c6943f;
        --card-white: #ffffff;
        --border-subtle: rgba(0, 0, 0, 0.08);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --input-bg: #f8fafc;
    }

    body {
        background: linear-gradient(135deg, #fdf6ec 0%, #ffffff 100%);
        background-attachment: fixed;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--text-main);
    }

    .profile-mini-wrapper {
        max-width: 480px;
        margin: 60px auto;
        padding: 0 15px;
    }

    .profile-card {
        background: var(--card-white);
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        overflow: hidden;
        border: 1px solid var(--border-subtle);
    }

    /* Internal Card Header */
    .card-inner-header {
        background: #fafafa;
        padding: 25px;
        border-bottom: 1px solid var(--border-subtle);
        text-align: center;
    }

    .card-inner-header i {
        font-size: 30px;
        color: var(--gold);
        margin-bottom: 10px;
    }

    .card-inner-header h3 {
        font-size: 24px;
        font-family: 'Times New Roman', Times, serif;
        text-transform: uppercase;
        font-weight: 800;
        margin: 0;
        letter-spacing: 1px;
        color: var(--navy);
    }

    .info-section {
        padding: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 9px;
        font-weight: 800;
        color: var(--gold);
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    /* Input Styling */
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper i {
        position: absolute;
        left: 12px;
        font-size: 14px;
        color: var(--text-muted);
    }

    .custom-input {
        width: 100%;
        padding: 11px 11px 11px 35px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--input-bg);
        font-size: 13px;
        color: var(--navy);
        box-sizing: border-box;
        font-family: inherit;
        transition: background 0.2s;
    }

    .custom-input:focus {
        outline: none;
        border-color: var(--gold);
        background: #fff;
    }

    /* Buttons Row */
    .form-footer {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }

    .btn-unified {
        padding: 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .btn-submit {
        flex: 2;
        background: var(--navy);
        color: #ffffff;
    }

    .btn-submit:hover {
        background: #334155;
    }

    .btn-cancel {
        flex: 1;
        background: #f1f5f9;
        color: var(--text-muted);
        border: 1px solid var(--border-subtle);
        text-decoration: none;
    }

    .btn-cancel:hover {
        background: #e2e8f0;
    }

    .btn-unified:active {
        transform: scale(0.96);
    }

    @media(max-width:480px) {
        .info-section {
            padding: 20px;
        }
    }
</style>

<div class="profile-mini-wrapper">
    <div class="profile-card">

        <div class="card-inner-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h3>Security Settings</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="info-section">

                <div class="form-group">
                    <label>Current Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="txt_oldpassword" class="custom-input" required
                            placeholder="Enter old password">
                    </div>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" name="txt_newpassword" class="custom-input" required
                            placeholder="Enter new password">
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-circle-check"></i>
                        <input type="password" name="txt_retypepassword" class="custom-input" required
                            placeholder="Confirm new password">
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-unified btn-submit">
                        <i class="fa-solid fa-shield-check"></i> Update Password
                    </button>
                    <a href="{% url 'ServiceProvider:ServiceProviderProfile' %}" class="btn-unified btn-cancel">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </a>
                </div>

            </div>
        </form>
    </div>
</div><br>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'ServiceProvider:ServiceProviderProfile' %}";
</script>
{% endif %}

{% endblock content %}
