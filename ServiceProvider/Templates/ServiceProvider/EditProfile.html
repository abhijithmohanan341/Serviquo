{% extends 'ServiceProvider/Header.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{
    --navy:#1e293b;
    --gold:#c6943f;
    --card-white:#ffffff;
    --border-subtle: rgba(0,0,0,0.08);
    --text-main:#1e293b;
    --text-muted:#64748b;
    --input-bg: #f8fafc;
}

body{
    background: linear-gradient(135deg, #fdf6ec 0%, #ffffff 100%);
    background-attachment: fixed;
    font-family: "Plus Jakarta Sans", sans-serif;
    color: var(--text-main);
}

.profile-mini-wrapper{
    max-width: 600px; 
    margin: 40px auto;
    padding: 0 15px;
}

.profile-card{
    background: var(--card-white);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.03);
    overflow: hidden;
    border: 1px solid var(--border-subtle);
}
.profile-title{
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    text-transform: uppercase;
    color: var(--navy);
    padding-bottom: 10px;
}

.card-inner-header {
    background: #fafafa;
    padding: 20px;
    border-bottom: 1px solid var(--border-subtle);
    text-align: center;
}

.card-inner-header h3 {
    font-size: 16px;
    text-transform: uppercase;
    font-weight: 700;
    margin: 0;
    letter-spacing: 1px;
    color: var(--navy);
}

.info-section{ padding: 25px; }

.info-grid-compact{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-tile{ display: flex; flex-direction: column; }

.info-tile label{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 5px;
    text-transform: uppercase;
}

input[type="text"], input[type="email"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    background: var(--input-bg);
    font-size: 13px;
    color: var(--navy);
    box-sizing: border-box;
    font-family: inherit;
    transition: 0.3s;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: #fff;
}

textarea {
    resize: none;
    height: 80px;
}

.span-full{ grid-column: 1 / -1; }

.form-footer {
    margin-top: 25px;
    display: flex;
    gap: 10px;
}

.btn-unified {
    padding: 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
}

.btn-submit {
    flex: 2;
    background: var(--navy);
    color: #ffffff;
}

.btn-submit:hover { background: #334155; transform: translateY(-2px); }

.btn-cancel {
    flex: 1;
    background: #f1f5f9;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
}

.btn-cancel:hover { background: #e2e8f0; }

@media(max-width:500px){
    .info-grid-compact { grid-template-columns: 1fr; }
    .span-full { grid-column: auto; }
}
</style>

<div class="profile-mini-wrapper">
    <div class="profile-topbar">
        <div class="profile-title">Update Profile</div>
    </div>
    <div class="profile-card">
        <div class="card-inner-header">
            <h3><i class="fa-solid fa-user-pen"></i> Edit Your Details</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="info-section">
                <div class="info-grid-compact">
                    
                    <div class="info-tile">
                        <label><i class="fa-solid fa-user"></i> Full Name</label>
                        <input type="text" name="txt_name" value="{{serviceproviderdata.serviceprovider_name}}" required pattern="^[A-Z][a-zA-Z ]*$">
                    </div>

                    <div class="info-tile">
                        <label><i class="fa-solid fa-phone"></i> Contact</label>
                        <input type="text" name="txt_contact" value="{{serviceproviderdata.serviceprovider_contact}}" required pattern="[7-9]{1}[0-9]{9}">
                    </div>

                    <div class="info-tile">
                        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" name="txt_email" value="{{serviceproviderdata.serviceprovider_email}}" required>
                    </div>

                    <div class="info-tile">
                        <label><i class="fa-solid fa-briefcase"></i> Experience Level</label>
                        <select name="sel_experience" required>
                            <option value="">Select Experience</option>
                            {% for e in experience %}
                                <option {% if e.id == serviceproviderdata.experience.id %}selected{% endif %} value="{{e.id}}">{{ e.experience_range|cut:"years"|cut:"year" }}&nbsp;years</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="info-tile">
                        <label><i class="fa-solid fa-city"></i> District</label>
                        <select name="sel_district" id="sel_district" required>
                            <option value="">Select District</option>
                            {% for i in district %}
                                <option {% if i.id == serviceproviderdata.place.district.id %}selected{% endif %} value="{{i.id}}">{{i.district_name}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="info-tile">
                        <label><i class="fa-solid fa-location-dot"></i> Place</label>
                        <select name="sel_place" id="sel_place" required>
                            <option value="">Select Place</option>
                            {% for i in place %}
                                <option {% if i.id == serviceproviderdata.place.id %}selected{% endif %} value="{{i.id}}">{{i.place_name}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="info-tile span-full">
                        <label><i class="fa-solid fa-house"></i> Full Address</label>
                        <textarea name="txt_address" required>{{serviceproviderdata.serviceprovider_address}}</textarea>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-unified btn-submit">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                    <a href="{% url 'ServiceProvider:ServiceProviderProfile' %}" class="btn-unified btn-cancel">
                        <i class="fa fa-home"></i> Back
                    </a>
                </div>
            </div>
        </form>
    </div>
</div><br>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$("#sel_district").change(function () {
    var did = $(this).val();
    $.ajax({
        url: "{% url 'Guest:ajaxplace' %}",
        data: { did: did },
        success: function (data){
            $("#sel_place").html(data);
        }
    });
});
</script>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'ServiceProvider:ServiceProviderProfile' %}";
</script>
{% endif %}

{% endblock content %}
