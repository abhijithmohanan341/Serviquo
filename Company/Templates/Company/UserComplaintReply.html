{% extends 'Company/Header.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --serviquo-gold: #c6943f;
        --amazon-blue: #232f3e;
        --soft-bg: rgba(255, 246, 230, 0.4);
    }

    body {
        background: linear-gradient(135deg, var(--soft-bg) 0%, rgba(255, 250, 242, 0.4) 100%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-height: 100vh;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 50px;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 25px;
        font-weight: 600;
        text-decoration: none;
        color: var(--amazon-blue);
    }

    .back-link i {
        margin-right: 6px;
    }

    .page-title-container {
        text-align: center;
        margin-bottom: 40px;
    }

    .page-title {
        font-family: "Times New Roman", Times, serif;
        font-weight: 400;
        font-size: 30px;
        color: #111;
        text-transform: uppercase;
        letter-spacing: 2px;
        display: inline-block;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(198, 148, 63, 0.3);
    }

    /* FORM CARD */

    .form-card {
        background: #fff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #f3f4f6;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .field-label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        color: var(--amazon-blue);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .custom-textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        background: #fafafa;
        resize: none;
    }

    /* BUTTON */

    .btn-submit {
        background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
        border: 1px solid #a88734;
        border-radius: 20px;
        padding: 10px 40px;
        color: #111;
        font-size: 13px;
        width: 100%;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.1s ease;
        box-shadow: 0 4px 0 #a88734;
        position: relative;
        top: 0;
        text-transform: uppercase;
    }

    .btn-submit:active {
        top: 3px;
        box-shadow: 0 1px 0 #a88734;
    }
</style>



<div class="container">

    <a href="{% url 'Company:ViewUserComplaint' cid %}" class="back-link">
        <i class="fa-solid fa-circle-left"></i> Back
    </a>

    <div class="page-title-container">
        <h2 class="page-title">Complaint Reply</h2>
    </div>


    <div class="form-card">

        <form action="" method="post">

            {% csrf_token %}

            <div class="form-group">

                <label class="field-label">Write Your Reply</label>

                <textarea name="txt_reply" class="custom-textarea" rows="5" required
                    placeholder="Type your response to the complaint..."></textarea>

            </div>


            <button type="submit" name="btn_submit" class="btn-submit">

                <i class="fa-solid fa-paper-plane" style="margin-right:8px;"></i>

                Submit Reply

            </button>

        </form>

    </div>

    <br><br>

</div>



{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Company:ViewUserComplaint' cid %}";
</script>
{% endif %}

{% endblock content %}
