{% extends 'Technician/Header.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --serviquo-gold: #c6943f;
        --amazon-blue: #232f3e;
        --soft-bg: rgba(255, 246, 230, 0.4);
        --card-shadow: 0 18px 50px rgba(15, 23, 42, .08);
    }

    body {
        background: linear-gradient(135deg, rgba(255, 246, 230, 0.4) 0%, rgba(255, 250, 242, 0.4) 100%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-height: 100vh;
    }

    .viewbooking-wrapper {
        padding: 60px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Professional Landscape Form Card */
    .amount-card {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
        border: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
    }

    /* Integrated Header & Heading */
    .card-header-accent {
        background: var(--amazon-blue);
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid var(--serviquo-gold);
    }

    .header-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
    }

    .header-title-group i {
        color: var(--serviquo-gold);
        font-size: 18px;
    }

    .header-title-group h2 {
        margin: 0;
        font-family: "Times New Roman", Times, serif;
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #c6943f;
        font-weight: 400;
    }

    .form-container {
        padding: 35px 45px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 10px;
        font-weight: 800;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 0.8px;
    }

    /* Sleek, Decreased Height Input */
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper i {
        position: absolute;
        left: 15px;
        color: var(--amazon-blue);
        font-size: 14px;
        opacity: 0.7;
    }

    .amount-input {
        width: 100%;
        padding: 10px 15px 10px 40px; /* Reduced vertical padding */
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: var(--amazon-blue);
        transition: all 0.3s ease;
        background: #f8fafc;
        appearance: none;
        -moz-appearance: textfield;
    }

    /* Remove arrows */
    .amount-input::-webkit-outer-spin-button,
    .amount-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .amount-input:focus {
        outline: none;
        border-color: var(--serviquo-gold);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(198, 148, 63, 0.1);
    }

    /* Action Buttons Area */
    .btn-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }

    .btn-submit {
        padding: 10px 30px;
        border-radius: 25px;
        font-size: 12px;
        font-weight: 800;
        background: var(--serviquo-gold);
        color: white;
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.1s ease;
        box-shadow: 0 4px 12px rgba(198, 148, 63, 0.2);
    }

    /* Press Effect */
    .btn-submit:active {
        transform: scale(0.96);
    }

    .btn-back {
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        color: #64748b;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s ease;
    }

    .btn-back:hover {
        color: var(--amazon-blue);
    }
</style>

<div class="viewbooking-wrapper">
    <div class="amount-card">
        <div class="card-header-accent">
            <div class="header-title-group">
                <i class="fas fa-coins"></i>
                <h2>Add Amount</h2>
            </div>
        </div>

        <form action="" method="post" class="form-container">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="txt_amount">Add Amount</label>
                <div class="input-wrapper">
                    <i class="fas fa-indian-rupee-sign"></i>
                    <input type="text" 
                           name="txt_amount" 
                           id="txt_amount" 
                           class="amount-input" 
                           placeholder="Eg: 1500.00" 
                           inputmode="decimal"
                           pattern="[0-9]*\.?[0-9]*"
                           required>
                </div>
            </div>

            <div class="btn-row">
                <a href="javascript:history.back()" class="btn-back">
                    <i class="fa-solid fa-circle-left"></i>Back to Request
                </a>
                
                <button type="submit" name="btn_submit" class="btn-submit">
                    <i class="fas fa-check-circle"></i> Add Amount
                </button>
            </div>
        </form>
    </div>
</div><br>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Technician:MyRequest' %}";
</script>
{% endif %}

{% endblock content %}
