<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Success</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:#eef2f7;
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Receipt Shell */
.container{
    width:360px;
    background:#f7f7f7;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    overflow:hidden;
}

/* Receipt Header */
.header{
    background:linear-gradient(90deg,#1f42ce,#5b4dee); 
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:18px;
    font-weight:600;
}

/* Receipt Body */
.receipt{
    background:#fff;
    padding:26px 22px;
    animation:print 1.2s ease;
}

/* Success Icon */
.success-icon{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#2ecc71;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    margin:0 auto 15px;
}

/* Text */
.title{
    text-align:center;
    font-size:20px;
    font-weight:600;
    margin-bottom:6px;
}

.desc{
    text-align:center;
    font-size:14px;
    color:#666;
    margin-bottom:22px;
}

/* Divider */
.hr{
    border-top:1px dashed #ccc;
    margin:18px 0;
}

/* Transaction */
.label{
    text-align:center;
    font-size:14px;
    color:#888;
}

/* Transaction Row */
.txn-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:6px;
}

.txn{
    font-size:24px;
    font-weight:600;
    letter-spacing:1px;
}

/* Copy Button */
.copy-btn{
    background:#eef2f7;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    color:#2f3542;
    transition:.2s;
}

.copy-btn:hover{
    background:#dfe6f1;
}

/* Print Button */
.print-btn{
    background:#eef2f7;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    color:#2f3542;
    transition:.2s;
}

.print-btn:hover{
    background:#dfe6f1;
}

/* Copied text */
.copied{
    text-align:center;
    font-size:12px;
    color:#27ae60;
    margin-top:6px;
    display:none;
}

/* Footer */
.footer{
    text-align:center;
    font-size:14px;
    color:#27ae60;
    margin-top:14px;
}

/* Receipt Tear */
.tear{
    height:18px;
    background:
        linear-gradient(45deg, transparent 75%, #f7f7f7 75%) repeat-x;
    background-size:18px 18px;
}

/* Animation */
@keyframes print{
    from{ transform:translateY(-80px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
}

/* Hide buttons on print */
@media print{
    .copy-btn,.print-btn{ display:none; }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">Payment Receipt</div>

    <div class="receipt">

        <div class="success-icon">✓</div>

        <div class="title">Payment Successful</div>
        <div class="desc">
            Your transaction has been completed successfully.
        </div>

        <div class="hr"></div>

        <div class="label">Transaction ID</div>

        <div class="txn-row">
            <div class="txn" id="txn"></div>
            <button class="copy-btn" onclick="copyTxn()">Copy</button>
            <button class="print-btn" onclick="printReceipt()">
                <i class="fa fa-print"></i>
            </button>
        </div>

        <div class="copied" id="copiedText">Transaction ID copied</div>

        <div class="footer">Thank you for your payment</div>

    </div>

    <div class="tear"></div>

</div>

<script>
function generateTransactionID(){
    return Math.floor(100000000 + Math.random() * 900000000);
}
document.getElementById("txn").innerText = generateTransactionID();

function copyTxn(){
    const txn = document.getElementById("txn").innerText;
    navigator.clipboard.writeText(txn);
    document.getElementById("copiedText").style.display="block";
    setTimeout(()=>{
        document.getElementById("copiedText").style.display="none";
    },2000);
}

function printReceipt(){
    window.print();
}

setTimeout(function(){
    window.location.href = "{% url 'User:homepage' %}";
}, 8000);
</script>

</body>
</html>
